<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Imaduddin Ahmed. Software engineer, security specialization. Founder of Routy. Toronto."
    />
    <meta name="theme-color" content="#0A0A0B" />
    <link
      rel="preload"
      href="/fonts/clash-display-600.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/instrument-serif-italic.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <title>Imaduddin Ahmed · Software Engineer</title>
  </head>
  <body>
    <!-- Static hero shell: painted before the bundle arrives, replaced by
         React with identical markup. Keep in sync with Hero.jsx. -->
    <div id="root">
      <section aria-label="Player profile" class="relative flex min-h-svh flex-col justify-end">
        <svg
          aria-hidden="true"
          class="pointer-events-none absolute inset-0 h-full w-full"
          viewBox="0 0 100 100"
          preserveAspectRatio="none"
        >
          <line x1="100" y1="0" x2="0" y2="100" stroke="var(--color-hairline)" stroke-width="1" vector-effect="non-scaling-stroke" />
          <line x1="54" y1="46" x2="46" y2="54" stroke="var(--color-seal)" stroke-width="1" vector-effect="non-scaling-stroke" />
        </svg>
        <div class="relative flex flex-1 flex-col justify-center px-6 pt-14 md:px-12">
          <p class="label-mono text-steel">PLAYER PROFILE / SEASON 2026 / TORONTO</p>
          <h1 class="display-face mt-6 text-hero text-bone">IMADUDDIN<br />AHMED</h1>
          <p class="mt-8 max-w-xl text-body text-steel">
            Software engineer, security specialization. Founder of Routy. Every line on this
            record was <em class="serif-accent">earned.</em>
          </p>
        </div>
        <ul class="relative grid border-t border-hairline bg-ink md:grid-cols-3" aria-label="Record summary">
          <li class="label-mono px-6 py-5 text-steel md:px-12">LIVE PRODUCT: ROUTY</li>
          <li class="label-mono border-t border-hairline px-6 py-5 text-steel md:border-t-0 md:border-l md:px-12">03 INTERNSHIPS</li>
          <li class="label-mono border-t border-hairline px-6 py-5 text-steel md:border-t-0 md:border-l md:px-12">SECURITY SPEC · YORK '27</li>
        </ul>
      </section>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
